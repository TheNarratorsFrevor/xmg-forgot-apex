<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- xfad runs as root and owns the name. -->
  <policy user="root">
    <allow own="dev.nulliche.xfa"/>
  </policy>
  <!-- Any local user may talk to it (single-user laptop; tighten with polkit if needed). -->
  <policy context="default">
    <allow send_destination="dev.nulliche.xfa"/>
    <allow receive_sender="dev.nulliche.xfa"/>
  </policy>
</busconfig>
