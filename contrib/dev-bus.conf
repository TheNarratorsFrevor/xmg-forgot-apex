<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Private message bus for developing xfad without touching the system bus policy.
     Start with: dbus-daemon \-\-config-file=contrib/dev-bus.conf \-\-fork
     Then: sudo xfad \-\-address unix:path=/tmp/xfa-dev-bus
           XFA_BUS_ADDRESS=unix:path=/tmp/xfa-dev-bus xfa status -->
<busconfig>
  <type>session</type>
  <listen>unix:path=/tmp/xfa-dev-bus</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow user="*"/>
    <allow own="*"/>
    <allow send_destination="*"/>
    <allow receive_sender="*"/>
  </policy>
</busconfig>
